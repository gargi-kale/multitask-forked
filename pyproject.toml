[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multitask"
version = "0.2.0"
description = "A flexible multi-task learning library for natural language processing with support for hierarchical task structures."
readme = "README.md"
authors = [
    {name = "Josephene Ginting"},
    {name = "Eddie Ye Tian"},
    {name = "Isaac D. Mehlhaff", email = "isaac.mehlhaff@gmail.com"},
    {name = "Marco Morucci", email = "moruccim@msu.edu"}
]
license = "MIT"
requires-python = ">=3.11,<3.13"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["deep-learning", "machine-learning", "nlp", "multi-task-learning", "tensorflow", "neural-networks"]

dependencies = [
    "tensorflow>=2.19,<3",
    "tensorflow-hub>=0.16,<1",
    "tensorflow-text>=2.19,<3",
    "tf-models-official>=2.19,<3",
    "numpy>=1.26,<2",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
huggingface = [
    "transformers>=4.30",
    "huggingface-hub>=0.36",
    "torch>=2.0",
    "diskcache>=5.0",
]
openai = [
    "openai>=2.0",
    "diskcache>=5.0",
]
cohere = [
    "cohere>=5.0",
    "diskcache>=5.0",
]
voyageai = [
    "voyageai>=0.3",
    "diskcache>=5.0",
]
regression = [
    "scipy>=1.10",
]
text = [
    "tensorflow-text>=2.19,<3",
]
dev = [
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "coverage>=7.0",
    "black>=25.0",
    "mypy>=1.19",
    "python-dotenv>=1.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/multitask"
Documentation = "https://github.com/yourusername/multitask#readme"
Repository = "https://github.com/yourusername/multitask.git"
"Bug Tracker" = "https://github.com/yourusername/multitask/issues"

[tool.setuptools]
packages = ["multitask", "multitask.models", "multitask.layers", "multitask.trainers", "multitask.data", "multitask.utils"]

[tool.setuptools.package-data]
multitask = ["py.typed"]

[tool.black]
line-length = 100
target-version = ['py311', 'py312']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=multitask --cov-report=term-missing --cov-report=html"
