[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multitask"
version = "0.1.0"
description = "A flexible multi-task learning library for NLP with support for hierarchical task structures."
readme = "README.md"
authors = [
    {name = "Isaac D. Mehlhaff", email = "imehlhaff@uchicago.edu"},
    {name = "Marco Morucci", email = "moruccim@msu.edu"}
]
license = "MIT"
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["deep-learning", "machine-learning", "nlp", "multi-task-learning", "tensorflow", "neural-networks"]

dependencies = [
    "tensorflow>=2.15.0",
    "tensorflow-hub>=0.15.0",
    "tensorflow-text>=2.15.0",
    "tf-models-official",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "pyyaml",
]

[project.optional-dependencies]
huggingface = [
    "transformers>=4.30.0",
    "huggingface-hub>=0.36.0",
    "torch>=2.0.0",
]
openai = [
    "openai>=2.0.0",
]
cohere = [
    "cohere>=5.0.0",
]
voyageai = [
    "voyageai>=0.3.0",
]
text = [
    "tensorflow-text>=2.15.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
    "coverage>=7.0.0",
]
docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=1.3.0",
]
# Mirrors environment.yml pip section for full local/test env parity
