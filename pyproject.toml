[project.urls]
Homepage = "https://github.com/yourusername/multitask"
Documentation = "https://github.com/yourusername/multitask#readme"
Repository = "https://github.com/yourusername/multitask.git"
"Bug Tracker" = "https://github.com/yourusername/multitask/issues"

[tool.setuptools]
packages = ["multitask", "multitask.models", "multitask.layers", "multitask.trainers", "multitask.data", "multitask.utils"]

[tool.setuptools.package-data]
multitask = ["py.typed"]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=multitask --cov-report=term-missing --cov-report=html"
