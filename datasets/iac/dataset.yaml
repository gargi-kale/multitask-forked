# IAC + Propaganda + IBM (the paper's data): no_prop_overlap_{train,val,test}.csv.
# Put the three files in this folder, or point to them: --data iac=/path/to/folder
#
# Outputs are the paper's ten (Table 3): the 18 propaganda technique heads are
# merged into one Propaganda output (max), plus Argument Quality (WA_bi) and the
# 8 IAC discourse labels. Three task groups: propaganda_binary, wa_bi, discourse.
#
# consistency_skip: Propaganda rows carry IAC labels made by a rule from the
# technique tags (not annotators), so famo_consf1_m5 keeps those rows out of the
# IAC heads' consistency targets. To remove the rule labels altogether (every
# result from Nov 6 2026 on), add:  --hide-source Propaganda:group:discourse
name: iac
data_dir: .
files:
  train: no_prop_overlap_train.csv
  val: no_prop_overlap_val.csv
  test: no_prop_overlap_test.csv
text_column: text
source_column: dataset
tasks:
