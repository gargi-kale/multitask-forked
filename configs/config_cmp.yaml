dataset_name: 'CMP'

main_task_names:
  - '202'
  - '305'
  - '607'
  - '608'

task_sizes:
  - 3
  - 3
  - 3
  - 2

pooled_task_name: '000'

targets_file: './input/targets_cmp.json'

select_columns:
  - 'text'
  - '202.1'
  - '202.3'
  - '202.4'
  - '305.1'
  - '305.2'
  - '305.3'
  - '607.1'
  - '607.2'
  - '607.3'
  - '608.2'
  - '608.3'

data_path: './data/CMP_data/CMP'

sample_size_ratio: 1.0

encoder:
  encoder_type: 'BERT'
  encoder_model_name: 'small_bert/bert_en_uncased_L-2_H-128_A-2'

training_params:
  epochs: 10
  init_lr: .0003
  wt_decay_rate: 0.01
  warmup_pct: 5
  dropout: 0.4
  batch_size: 256
  workers: 1
  seq_length: 512

testing_params:
  batch_size: 256
  workers: 1
  seq_length: 512
